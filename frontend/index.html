<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myfitnesspal</title>

<style>
  :root {
    color-scheme: light dark;
  }

  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  h1 {
    font-size: 1.4rem;
  }

  nav {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  nav button {
    flex: 1;
    padding: 0.6rem;
    cursor: pointer;
    border: 1px solid #888;
    background: #eee;
    color: #111;
    border-radius: 6px;
  }

  nav button.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  section {
    display: none;
  }

  section.active {
    display: block;
  }

  label {
    display: block;
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }

  input,
  select {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.25rem;
    box-sizing: border-box;
  }

  button.submit {
    margin-top: 1rem;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
  }

  .msg {
    margin-top: 0.75rem;
    font-size: 0.9rem;
  }

  .msg.ok {
    color: #1a7f37;
  }

  .msg.err {
    color: #c0392b;
  }

  /* Food filter */
  #food-filter {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.75rem;
  }

  #food-filter button {
    flex: 1;
    padding: 0.4rem 0.5rem;
    cursor: pointer;
    border: 1px solid #888;
    background: #eee;
    color: #111;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  #food-filter button.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  /* Food list */
  #food-list {
    margin-top: 0.75rem;
  }

  .food-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid #ddd;
  }

  .food-info {
    flex: 1;
    min-width: 0;
  }

  .food-name {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .frequent-badge {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: #dff0d8;
    color: #1a7f37;
  }

  .food-macros {
    color: #888;
    font-size: 0.8rem;
    margin-top: 0.2rem;
  }

  /* Delete button */
  .delete-btn {
    flex-shrink: 0;
    width: 1.6rem;
    height: 1.6rem;
    padding: 0;
    cursor: pointer;
    border: 1px solid #c0392b;
    color: #c0392b;
    background: transparent;
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn:hover {
    background: #c0392b;
    color: white;
  }

  .food-actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .toggle-frequent-btn {
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    border: 1px solid #888;
    color: #333;
    background: transparent;
    border-radius: 5px;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .toggle-frequent-btn:hover {
    background: #eee;
  }

  /* Searchable food combobox */
  .combobox {
    position: relative;
  }

  .combobox-list {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 0.25rem;
    max-height: 220px;
    overflow-y: auto;
    background: #161616;
    border: 1px solid #333;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    z-index: 10;
  }

  .combobox-list.open {
    display: block;
  }

  .combobox-option {
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    font-size: 0.95rem;
    color: #e8e8e8;
  }

  .combobox-option:hover,
  .combobox-option.highlighted {
    background: #333;
  }

  .combobox-empty {
    padding: 0.5rem 0.6rem;
    color: #999;
    font-style: italic;
    font-size: 0.9rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
  }

  th,
  td {
    text-align: left;
    padding: 0.4rem 0.3rem;
    border-bottom: 1px solid #ddd;
    font-size: 0.9rem;
  }

  th:last-child,
  td:last-child {
    text-align: right;
  }

  .totals {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }

  .totals div {
    flex: 1;
    text-align: center;
    padding: 0.5rem;
    background: #f2f2f2;
    color: #111;
    border-radius: 6px;
    font-weight: bold;
  }

  .remaining-totals {
    margin-top: 0.5rem;
  }

  .remaining-totals div {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .remaining-totals div.under-target {
    background: #dff0d8;
    color: #1a7f37;
  }

  .remaining-totals div.over-target {
    background: #f8d7da;
    color: #c0392b;
  }

  .targets-toggle-btn {
    margin-top: 0.75rem;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    border: 1px solid #888;
    color: #333;
    background: transparent;
    border-radius: 5px;
    font-size: 0.8rem;
  }

  .targets-toggle-btn:hover {
    background: #eee;
  }

  .targets-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 0.6rem;
    padding: 0.6rem;
    background: #f2f2f2;
    border-radius: 6px;
  }

  .targets-panel label {
    flex: 1;
    min-width: 80px;
    margin-top: 0;
    font-size: 0.8rem;
    color: #333;
  }

  .empty {
    color: #888;
    font-style: italic;
    margin-top: 1rem;
  }

  .loading {
    color: #888;
    font-style: italic;
    margin-top: 1rem;
  }

  @media (max-width: 600px) {
    .totals {
      gap: 0.4rem;
    }

    .totals div {
      font-size: 0.85rem;
    }

    table {
      font-size: 0.8rem;
    }

    th,
    td {
      padding: 0.35rem 0.2rem;
    }
  }
</style>
</head>

<body>

<h1>myfitnesspal</h1>

<nav>
  <button data-tab="create" class="active">Create Food</button>
  <button data-tab="log">Log Food</button>
  <button data-tab="daily">Daily Log</button>
</nav>

<!-- ==================== CREATE FOOD ==================== -->

<section id="create" class="active">

  <form id="create-form">

    <label>
      Name
      <input type="text" id="c-name" required>
    </label>

    <label>
      Calories
      <input type="number" id="c-cal" value="0" step="any">
    </label>

    <label>
      Protein (g)
      <input type="number" id="c-protein" value="0" step="any">
    </label>

    <label>
      Carbs (g)
      <input type="number" id="c-carbs" value="0" step="any">
    </label>

    <label>
      Fat (g)
      <input type="number" id="c-fat" value="0" step="any">
    </label>

    <button class="submit" type="submit">
      Add Food
    </button>

  </form>

  <div id="create-msg" class="msg"></div>

  <div id="food-list"></div>

</section>

<!-- ==================== LOG FOOD ==================== -->

<section id="log">

  <div id="food-filter">
    <button data-filter="all" class="active" type="button">All</button>
    <button data-filter="frequent" type="button">Frequent</button>
    <button data-filter="infrequent" type="button">Infrequent</button>
  </div>

  <form id="log-form">

    <label>
      Food
      <div class="combobox">
        <input
          type="text"
          id="l-food-input"
          placeholder="Click or type to search foods…"
          autocomplete="off"
        >
        <div id="l-food-dropdown" class="combobox-list"></div>
      </div>
    </label>

    <label>
      Multiplier
      <input
        type="number"
        id="l-mult"
        value="1"
        step="any"
        min="0"
      >
    </label>

    <label>
      Date
      <input type="date" id="l-date">
    </label>

    <button class="submit" type="submit">
      Log It
    </button>

  </form>

  <div id="log-msg" class="msg"></div>

</section>

<!-- ==================== DAILY LOG ==================== -->

<section id="daily">

  <label>
    Date
    <input type="date" id="d-date">
  </label>

  <div class="totals">

    <div>
      Cal<br>
      <span id="t-cal">0</span>
    </div>

    <div>
      Protein<br>
      <span id="t-protein">0</span>g
    </div>

    <div>
      Carbs<br>
      <span id="t-carbs">0</span>g
    </div>

    <div>
      Fat<br>
      <span id="t-fat">0</span>g
    </div>

  </div>

  <div class="totals remaining-totals" id="remaining-totals" style="display:none">

    <div id="r-cal-box">
      Cal left<br>
      <span id="r-cal">0</span>
    </div>

    <div id="r-protein-box">
      Protein left<br>
      <span id="r-protein">0</span>g
    </div>

    <div id="r-carbs-box">
      Carbs left<br>
      <span id="r-carbs">0</span>g
    </div>

    <div id="r-fat-box">
      Fat left<br>
      <span id="r-fat">0</span>g
    </div>

  </div>

  <button
    type="button"
    id="targets-toggle-btn"
    class="targets-toggle-btn"
  >
    Set targets
  </button>

  <div id="targets-panel" class="targets-panel" style="display:none">

    <label>
      Cal
      <input type="number" id="tgt-cal" value="0" min="0" step="any">
    </label>

    <label>
      Protein (g)
      <input type="number" id="tgt-protein" value="0" min="0" step="any">
    </label>

    <label>
      Carbs (g)
      <input type="number" id="tgt-carbs" value="0" min="0" step="any">
    </label>

    <label>
      Fat (g)
      <input type="number" id="tgt-fat" value="0" min="0" step="any">
    </label>

  </div>

  <table id="d-table" style="display:none">

    <thead>
      <tr>
        <th>Food</th>
        <th>x</th>
        <th>Cal</th>
        <th>P</th>
        <th>C</th>
        <th>F</th>
        <th></th>
      </tr>
    </thead>

    <tbody id="d-body"></tbody>

  </table>

  <div
    id="d-empty"
    class="empty"
    style="display:none"
  >
    No food logged for this day
  </div>

</section>

<script>

const BASE = "__API_BASE__";

/* ============================================================
   Generic RPC helper
   ============================================================ */

async function rpc(service, method, body) {

  const res = await fetch(`${BASE}/${service}/${method}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body),
  });

  if (!res.ok) {

    let detail = "";

    try {
      const json = await res.json();
      detail = json.message || "";
    } catch {}

    throw new Error(
      detail ||
      `${service}/${method} failed (${res.status})`
    );
  }

  return res.json();
}


/* ============================================================
   API
   ============================================================ */

const Food = {

  create: (req) =>
    rpc(
      "food.v1.FoodService",
      "CreateFood",
      req
    ),

  list: () =>
    rpc(
      "food.v1.FoodService",
      "ListFoods",
      {}
    ),

  delete: (id) =>
    rpc(
      "food.v1.FoodService",
      "DeleteFood",
      { id }
    ),

  setFrequent: (id, isFrequent) =>
    rpc(
      "food.v1.FoodService",
      "SetFoodFrequent",
      { id, isFrequent }
    ),
};


const Log = {

  create: (req) =>
    rpc(
      "log.v1.LogService",
      "CreateLogEntry",
      req
    ),

  byDate: (date) =>
    rpc(
      "log.v1.LogService",
      "ListLogEntriesByDate",
      { date }
    ),

  delete: (id) =>
    rpc(
      "log.v1.LogService",
      "DeleteLogEntry",
      { id }
    ),
};


/* ============================================================
   State
   ============================================================ */

let foods = [];
let foodFilter = "all"; // "all" | "frequent" | "infrequent"

const todayStr = () =>
  new Date().toISOString().slice(0, 10);

let selectedDate = todayStr();

let lastTotals = {};

const TARGETS_KEY = "myfitnesspal:targets";

let targets = { calories: 0, proteinG: 0, carbsG: 0, fatG: 0 };

function loadTargets() {

  try {

    const raw = localStorage.getItem(TARGETS_KEY);

    if (raw) {
      targets = { ...targets, ...JSON.parse(raw) };
    }

  } catch (err) {

    console.error(
      "Failed to load targets:",
      err
    );
  }
}

function saveTargets() {

  try {

    localStorage.setItem(
      TARGETS_KEY,
      JSON.stringify(targets)
    );

  } catch (err) {

    console.error(
      "Failed to save targets:",
      err
    );
  }
}

function applyRemainingBox(
  boxId,
  spanId,
  target,
  consumed
) {

  const box =
    document.getElementById(boxId);

  const span =
    document.getElementById(spanId);

  const remaining =
    target - (consumed || 0);

  span.textContent =
    Math.round(remaining);

  box.classList.remove(
    "under-target",
    "over-target"
  );

  box.classList.add(
    remaining < 0
      ? "over-target"
      : "under-target"
  );
}

function renderRemaining() {

  const panel =
    document.getElementById(
      "remaining-totals"
    );

  const hasTarget =
    targets.calories > 0 ||
    targets.proteinG > 0 ||
    targets.carbsG > 0 ||
    targets.fatG > 0;


  if (!hasTarget) {

    panel.style.display = "none";

    return;
  }


  panel.style.display = "flex";

  applyRemainingBox(
    "r-cal-box",
    "r-cal",
    targets.calories,
    lastTotals.calories
  );

  applyRemainingBox(
    "r-protein-box",
    "r-protein",
    targets.proteinG,
    lastTotals.proteinG
  );

  applyRemainingBox(
    "r-carbs-box",
    "r-carbs",
    targets.carbsG,
    lastTotals.carbsG
  );

  applyRemainingBox(
    "r-fat-box",
    "r-fat",
    targets.fatG,
    lastTotals.fatG
  );
}


document
  .getElementById("targets-toggle-btn")
  .addEventListener("click", () => {

    const panel =
      document.getElementById(
        "targets-panel"
      );

    const isOpen =
      panel.style.display !== "none";

    panel.style.display =
      isOpen ? "none" : "flex";

    document.getElementById(
      "targets-toggle-btn"
    ).textContent =
      isOpen
        ? "Set targets"
        : "Hide targets";
  });


function wireTargetInput(inputId, key) {

  const input =
    document.getElementById(inputId);

  input.value = targets[key];

  input.addEventListener(
    "change",
    () => {

      targets[key] =
        Number(input.value) || 0;

      saveTargets();

      renderRemaining();
    }
  );
}


loadTargets();

wireTargetInput("tgt-cal", "calories");
wireTargetInput("tgt-protein", "proteinG");
wireTargetInput("tgt-carbs", "carbsG");
wireTargetInput("tgt-fat", "fatG");


/* ============================================================
   Tabs
   ============================================================ */

document
  .querySelectorAll("nav button")
  .forEach((btn) => {

    btn.addEventListener("click", () => {

      document
        .querySelectorAll("nav button")
        .forEach((b) =>
          b.classList.remove("active")
        );

      document
        .querySelectorAll("section")
        .forEach((s) =>
          s.classList.remove("active")
        );

      btn.classList.add("active");

      document
        .getElementById(btn.dataset.tab)
        .classList.add("active");

    });

  });


/* ============================================================
   Food filter (All / Frequent / Infrequent)
   ============================================================ */

document
  .querySelectorAll("#food-filter button")
  .forEach((btn) => {

    btn.addEventListener("click", () => {

      document
        .querySelectorAll("#food-filter button")
        .forEach((b) =>
          b.classList.remove("active")
        );

      btn.classList.add("active");

      foodFilter = btn.dataset.filter;

      renderFoodDropdown();
    });

  });


/* ============================================================
   Foods
   ============================================================ */

async function refreshFoods() {

  const res = await Food.list();

  foods = res.foods || [];


  /* ---------- Update dropdown (respects current filter) ---------- */

  renderFoodDropdown();


  /* ---------- Render food list (always shows all foods) ---------- */

  renderFoodList();
}


function filteredFoods() {

  return foods.filter((f) => {

    if (foodFilter === "frequent") {
      return !!f.isFrequent;
    }

    if (foodFilter === "infrequent") {
      return !f.isFrequent;
    }

    return true;
  });
}


let selectedFoodId = null;

function foodLabel(f, visible) {

  const nameCounts = new Map();

  for (const other of visible) {
    nameCounts.set(
      other.name,
      (nameCounts.get(other.name) || 0) + 1
    );
  }

  const base =
    f.isFrequent
      ? `★ ${f.name}`
      : f.name;

  return nameCounts.get(f.name) > 1
    ? `${base} (#${f.id})`
    : base;
}


function renderFoodDropdown() {

  const input =
    document.getElementById("l-food-input");


  if (foods.length === 0) {

    input.value = "";
    input.placeholder = "Add a food first";
    input.disabled = true;
    selectedFoodId = null;

    closeCombobox();

    return;
  }


  const visible = filteredFoods();


  if (visible.length === 0) {

    input.value = "";
    input.placeholder = `No ${foodFilter} foods`;
    input.disabled = true;
    selectedFoodId = null;

    closeCombobox();

    return;
  }


  input.disabled = false;
  input.placeholder = "Click or type to search foods…";


  /* If the currently selected food is no longer visible under
     this filter, clear the selection. */

  if (
    selectedFoodId !== null &&
    !visible.some((f) => f.id === selectedFoodId)
  ) {
    input.value = "";
    selectedFoodId = null;
  }


  renderComboboxOptions(input.value);
}


function renderComboboxOptions(query) {

  const list =
    document.getElementById("l-food-dropdown");

  list.innerHTML = "";


  const visible = filteredFoods();

  const q = (query || "").trim().toLowerCase();

  const matches = visible.filter((f) =>
    !q || f.name.toLowerCase().includes(q)
  );


  if (matches.length === 0) {

    const empty =
      document.createElement("div");

    empty.className = "combobox-empty";

    empty.textContent = "No matching foods";

    list.appendChild(empty);

    return;
  }


  for (const f of matches) {

    const label = foodLabel(f, visible);

    const opt =
      document.createElement("div");

    opt.className = "combobox-option";

    opt.textContent = label;


    /* mousedown (not click) so this fires before the input's
       blur event closes the dropdown */

    opt.addEventListener(
      "mousedown",
      (e) => {

        e.preventDefault();

        const input =
          document.getElementById(
            "l-food-input"
          );

        input.value = label;

        selectedFoodId = f.id;

        closeCombobox();
      }
    );

    list.appendChild(opt);
  }
}


function openCombobox() {

  document
    .getElementById("l-food-dropdown")
    .classList.add("open");
}


function closeCombobox() {

  document
    .getElementById("l-food-dropdown")
    .classList.remove("open");
}


document
  .getElementById("l-food-input")
  .addEventListener("focus", () => {

    renderComboboxOptions(
      document.getElementById(
        "l-food-input"
      ).value
    );

    openCombobox();
  });


document
  .getElementById("l-food-input")
  .addEventListener("input", (e) => {

    selectedFoodId = null;

    renderComboboxOptions(e.target.value);

    openCombobox();
  });


document
  .getElementById("l-food-input")
  .addEventListener("blur", () => {

    closeCombobox();
  });


function renderFoodList() {

  const list =
    document.getElementById("food-list");

  list.innerHTML = "";


  if (foods.length === 0) {

    list.innerHTML =
      `<div class="empty">No foods created yet</div>`;

    return;
  }


  for (const f of foods) {

    const item =
      document.createElement("div");

    item.className = "food-item";


    /* Food information */

    const info =
      document.createElement("div");

    info.className = "food-info";


    const name =
      document.createElement("div");

    name.className = "food-name";

    name.textContent = f.name;

    if (f.isFrequent) {

      const badge =
        document.createElement("span");

      badge.className = "frequent-badge";
      badge.textContent = "Frequent";

      name.appendChild(badge);
    }


    const macros =
      document.createElement("div");

    macros.className = "food-macros";

    macros.textContent =
      `${Math.round(f.calories)} cal · ` +
      `${Math.round(f.proteinG)}g P · ` +
      `${Math.round(f.carbsG)}g C · ` +
      `${Math.round(f.fatG)}g F`;


    info.appendChild(name);
    info.appendChild(macros);


    /* Toggle frequent button */

    const toggleButton =
      document.createElement("button");

    toggleButton.className =
      "toggle-frequent-btn";

    toggleButton.type = "button";

    toggleButton.textContent =
      f.isFrequent
        ? "Mark infrequent"
        : "Mark frequent";


    toggleButton.addEventListener(
      "click",
      async () => {

        toggleButton.disabled = true;

        try {

          await Food.setFrequent(
            f.id,
            !f.isFrequent
          );

          await refreshFoods();

        } catch (err) {

          alert(
            `Could not update frequency:\n\n${err.message}`
          );

          toggleButton.disabled = false;
        }

      }
    );


    /* Delete button */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.type = "button";

    deleteButton.textContent =
      "×";

    deleteButton.title =
      `Delete "${f.name}"`;

    deleteButton.setAttribute(
      "aria-label",
      `Delete ${f.name}`
    );


    deleteButton.addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            `Delete "${f.name}"?`
          );

        if (!confirmed) {
          return;
        }


        deleteButton.disabled = true;

        try {

          await Food.delete(f.id);

          await refreshFoods();

          await refreshDailyLog();

        } catch (err) {

          alert(
            `Could not delete food:\n\n${err.message}`
          );

          deleteButton.disabled = false;
        }

      }
    );


    const actions =
      document.createElement("div");

    actions.className = "food-actions";

    actions.appendChild(toggleButton);
    actions.appendChild(deleteButton);


    item.appendChild(info);
    item.appendChild(actions);

    list.appendChild(item);
  }
}


/* ============================================================
   Create Food
   ============================================================ */

document
  .getElementById("create-form")
  .addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      const msg =
        document.getElementById("create-msg");

      msg.textContent = "";
      msg.className = "msg";


      try {

        await Food.create({

          name:
            document.getElementById(
              "c-name"
            ).value,

          calories:
            Number(
              document.getElementById(
                "c-cal"
              ).value
            ) || 0,

          proteinG:
            Number(
              document.getElementById(
                "c-protein"
              ).value
            ) || 0,

          carbsG:
            Number(
              document.getElementById(
                "c-carbs"
              ).value
            ) || 0,

          fatG:
            Number(
              document.getElementById(
                "c-fat"
              ).value
            ) || 0,

        });


        /* Reset form */

        document
          .getElementById("create-form")
          .reset();


        document.getElementById(
          "c-cal"
        ).value = 0;

        document.getElementById(
          "c-protein"
        ).value = 0;

        document.getElementById(
          "c-carbs"
        ).value = 0;

        document.getElementById(
          "c-fat"
        ).value = 0;


        msg.textContent = "Added!";

        msg.classList.add("ok");


        await refreshFoods();

      } catch (err) {

        msg.textContent =
          err.message;

        msg.classList.add("err");
      }

    }
  );


/* ============================================================
   Log Food
   ============================================================ */

document
  .getElementById("log-form")
  .addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      const msg =
        document.getElementById("log-msg");

      msg.textContent = "";
      msg.className = "msg";


      const foodInput =
        document.getElementById(
          "l-food-input"
        );

      const foodId = selectedFoodId;


      if (!foodId) {

        msg.textContent = foodInput.value
          ? "No matching food — pick one from the list"
          : "Add a food first";

        msg.classList.add("err");

        return;
      }


      const loggedAt =
        document.getElementById(
          "l-date"
        ).value || "";


      try {

        await Log.create({

          foodId,

          multiplier:
            Number(
              document.getElementById(
                "l-mult"
              ).value
            ) || 1,

          loggedAt,

        });


        msg.textContent =
          "Logged!";

        msg.classList.add("ok");


        const effectiveDate =
          loggedAt || todayStr();


        if (
          effectiveDate ===
          selectedDate
        ) {

          await refreshDailyLog();
        }

      } catch (err) {

        msg.textContent =
          err.message;

        msg.classList.add("err");
      }

    }
  );


/* ============================================================
   Daily Log
   ============================================================ */

async function refreshDailyLog() {

  const res =
    await Log.byDate(
      selectedDate
    );


  const entries =
    res.logEntries || [];

  const totals =
    res.totals || {};


  /* ---------- Totals ---------- */

  document.getElementById(
    "t-cal"
  ).textContent =
    Math.round(
      totals.calories || 0
    );


  document.getElementById(
    "t-protein"
  ).textContent =
    Math.round(
      totals.proteinG || 0
    );


  document.getElementById(
    "t-carbs"
  ).textContent =
    Math.round(
      totals.carbsG || 0
    );


  document.getElementById(
    "t-fat"
  ).textContent =
    Math.round(
      totals.fatG || 0
    );


  lastTotals = totals;

  renderRemaining();


  /* ---------- Table ---------- */

  const body =
    document.getElementById(
      "d-body"
    );

  const table =
    document.getElementById(
      "d-table"
    );

  const empty =
    document.getElementById(
      "d-empty"
    );


  body.innerHTML = "";


  if (entries.length === 0) {

    table.style.display = "none";

    empty.style.display = "block";

    return;
  }


  table.style.display = "table";

  empty.style.display = "none";


  /* ---------- Render entries ---------- */

  for (const entry of entries) {

    const name =
      entry.foodName ||
      `Food #${entry.foodId}`;

    const mult =
      entry.multiplier || 1;


    const tr =
      document.createElement("tr");


    const foodCell =
      document.createElement("td");

    foodCell.textContent =
      name;


    const multCell =
      document.createElement("td");

    multCell.textContent =
      mult;


    const calCell =
      document.createElement("td");

    calCell.textContent =
      Math.round(
        (entry.calories || 0) * mult
      );


    const proteinCell =
      document.createElement("td");

    proteinCell.textContent =
      Math.round(
        (entry.proteinG || 0) * mult
      );


    const carbsCell =
      document.createElement("td");

    carbsCell.textContent =
      Math.round(
        (entry.carbsG || 0) * mult
      );


    const fatCell =
      document.createElement("td");

    fatCell.textContent =
      Math.round(
        (entry.fatG || 0) * mult
      );


    tr.appendChild(foodCell);
    tr.appendChild(multCell);
    tr.appendChild(calCell);
    tr.appendChild(proteinCell);
    tr.appendChild(carbsCell);
    tr.appendChild(fatCell);


    /* ---------- Delete log button ---------- */

    const deleteCell =
      document.createElement("td");


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.type = "button";

    deleteButton.textContent =
      "×";

    const foodNameForLabel =
      name;

    deleteButton.title =
      `Delete this ${foodNameForLabel} log entry`;

    deleteButton.setAttribute(
      "aria-label",
      `Delete ${foodNameForLabel} log entry`
    );


    deleteButton.addEventListener(
      "click",
      async () => {

        const foodName =
          foodNameForLabel;


        const confirmed =
          confirm(
            `Delete this ${foodName} log entry?`
          );


        if (!confirmed) {
          return;
        }


        deleteButton.disabled = true;


        try {

          await Log.delete(
            entry.id
          );

          await refreshDailyLog();

        } catch (err) {

          alert(
            `Could not delete log:\n\n${err.message}`
          );

          deleteButton.disabled = false;
        }

      }
    );


    deleteCell.appendChild(
      deleteButton
    );

    tr.appendChild(
      deleteCell
    );


    body.appendChild(tr);
  }
}


/* ============================================================
   Daily date change
   ============================================================ */

document
  .getElementById("d-date")
  .addEventListener(
    "change",
    async (e) => {

      selectedDate =
        e.target.value ||
        todayStr();

      await refreshDailyLog();
    }
  );


/* ============================================================
   Init
   ============================================================ */

(async function init() {

  document.getElementById(
    "d-date"
  ).value = selectedDate;


  document.getElementById(
    "l-date"
  ).value = selectedDate;


  try {

    await refreshFoods();

    await refreshDailyLog();

  } catch (err) {

    console.error(
      "Initialization failed:",
      err
    );

  }

})();

</script>
