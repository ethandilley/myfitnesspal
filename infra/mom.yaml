apiVersion: v1
kind: Namespace
metadata:
  name: momfitnesspal
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: momfitnesspal
type: Opaque
stringData:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: momfitnesspal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: momfitnesspal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: momfitnesspal
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "momfitnesspal"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "momfitnesspal"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: momfitnesspal
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: momfitnesspal-migrate
  namespace: momfitnesspal
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U user -d momfitnesspal; do echo waiting for postgres; sleep 2; done
      containers:
        - name: migrate
          image: 192.168.1.201:30500/momfitnesspal-migrate:latest
          imagePullPolicy: Always
          env:
            - name: DB_URL
              value: postgres://user:password@postgres:5432/momfitnesspal?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: momfitnesspal-server
  namespace: momfitnesspal
  labels:
    app: momfitnesspal-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: momfitnesspal-server
  template:
    metadata:
      labels:
        app: momfitnesspal-server
    spec:
      containers:
        - name: server
          image: 192.168.1.201:30500/momfitnesspal-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
          env:
            - name: DB_URL
              value: postgres://user:password@postgres:5432/momfitnesspal?sslmode=disable
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: momfitnesspal-server
  namespace: momfitnesspal
spec:
  selector:
    app: momfitnesspal-server
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: momfitnesspal-frontend
  namespace: momfitnesspal
  labels:
    app: momfitnesspal-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: momfitnesspal-frontend
  template:
    metadata:
      labels:
        app: momfitnesspal-frontend
    spec:
      containers:
        - name: frontend
          image: 192.168.1.201:30500/momfitnesspal-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: API_BASE
              value: https://momfitnesspal-api.dilleystone.com
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: momfitnesspal-frontend
  namespace: momfitnesspal
spec:
  selector:
    app: momfitnesspal-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momfitnesspal-frontend
  namespace: momfitnesspal
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: mom.dilleystone.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: momfitnesspal-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momfitnesspal-api
  namespace: momfitnesspal
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: momfitnesspal-api.dilleystone.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: momfitnesspal-server
                port:
                  number: 50051
